<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Mindset: Продажи 360°</title><style>
:root{--ink:#12222c;--teal:#05a6a6;--orange:#ff6b35;--paper:#f1f5f4;--muted:#687b86;--line:#dce5e3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1120px;margin:auto;min-height:100vh;padding:24px}.card{background:#fff;box-shadow:0 18px 55px #17323b18}.start{display:grid;grid-template-columns:1.1fr .9fr;min-height:680px}.intro{padding:64px;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#4fd1c5}.intro h1{font-size:48px;line-height:1.05;margin:24px 0}.intro p{font-size:18px;line-height:1.6;color:#bfd0d5}.metrics{display:flex;gap:36px;margin-top:40px}.metrics b{display:block;font-size:28px}.metrics span{font-size:12px;color:#9fb4bb}.form{padding:56px;display:flex;flex-direction:column;justify-content:center;gap:14px}.form h2{font-size:32px;margin:10px 0 4px}.form p,.muted{color:var(--muted)}label{font-weight:700;font-size:13px}input{width:100%;height:48px;padding:12px;border:1px solid var(--line);font-size:15px}button{height:48px;border:0;padding:0 22px;background:var(--orange);color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.4}.top{height:70px;padding:0 26px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.brand{width:38px;height:38px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900}.top small{display:block;color:var(--muted);margin-top:3px}.count{margin-left:auto;font-weight:800}.quiz{display:grid;grid-template-columns:290px 1fr;min-height:680px}.side{padding:28px;border-right:1px solid var(--line)}.side div{padding:12px;border-left:3px solid transparent}.side div.active{background:#eef8f6;border-color:var(--teal)}.side small{display:block;color:var(--muted);margin-top:4px}.q{padding:58px 8%;display:flex;flex-direction:column;justify-content:space-between}.chip{display:inline-block;padding:7px 10px;background:#e9f8f5;color:#087b7b;font-size:12px;font-weight:800}.q h1{font-size:34px;line-height:1.2;margin:22px 0 8px}.options{display:grid;gap:10px;margin:32px 0}.option{display:flex;align-items:center;gap:14px;min-height:58px;padding:12px 16px;border:1px solid var(--line);cursor:pointer}.option:hover,.option.sel{border-color:var(--teal);background:#f1fbf9}.option i{width:28px;height:28px;background:#edf2f1;display:grid;place-items:center;font-style:normal;font-weight:800}.actions{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px}.back{background:#fff;color:var(--ink);border:1px solid var(--line)}.resultHead{background:var(--ink);color:#fff;padding:42px 54px;display:flex;justify-content:space-between}.resultHead h1{font-size:40px;margin:12px 0}.score{font-size:52px;font-weight:900;color:#fff}.result{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;padding:20px}.panel{padding:30px;background:#fff;border:1px solid var(--line)}.bar{margin:18px 0}.bar div:first-child{display:flex;justify-content:space-between;font-size:13px}.track{height:9px;background:#edf1f0;margin-top:7px}.track i{display:block;height:100%;background:var(--teal)}.focus{padding:16px 0;border-top:1px solid var(--line)}@media(max-width:800px){.wrap{padding:0}.start,.quiz,.result{grid-template-columns:1fr}.intro,.form{padding:36px}.intro h1{font-size:38px}.side{display:none}.q{padding:34px 22px}.q h1{font-size:28px}.resultHead{padding:32px 24px}.metrics{gap:20px}}
</style></head><body><main class="wrap"><div id="app"></div></main><script>
const B=[['Цифровые навыки',['Осваиваю новые цифровые инструменты','Уверенно работаю с таблицами и формулами','Быстро нахожу информацию в системах','Использую шаблоны и горячие клавиши']],['CRM-дисциплина',['Вношу результат контакта в CRM в день взаимодействия','У каждой сделки указаны сумма, этап и следующий шаг','Регулярно очищаю воронку','Использую задачи и напоминания CRM']],['Работа с данными',['Принимаю решения по показателям воронки','Знаю личные конверсии','Сравниваю план, факт и прогноз','Объясняю отклонения цифрами']],['ИИ и автоматизация',['Использую ИИ для писем, КП и сценариев','Проверяю результат, созданный ИИ','Автоматизирую повторяющиеся операции','Соблюдаю безопасность данных']],['Цифровая коммуникация',['Подбираю канал под клиента','Использую цифровые материалы','Фиксирую договорённости письменно','Структурно провожу онлайн-встречи']],['Результативность',['Инструменты сокращают время подготовки','Данные помогают повышать конверсию','Тестирую новые подходы','Могу показать измеримый эффект']]];const Q=B.flatMap((b,bi)=>b[1].map((t,qi)=>({t,bi,qi}))),O=['Практически никогда','Редко','Иногда','Часто','Системно'];let st={page:'start',name:'',team:'',idx:0,a:{}};const app=document.querySelector('#app');function level(s){return s>=85?['Цифровой лидер','Технологии используются системно и дают измеримый эффект.']:s>=70?['Уверенный пользователь','Хорошая база. Фокус — стандартизация практик.']:s>=50?['Развивающийся','Инструменты применяются, но пока не стали системой.']:['Стартовый уровень','Нужен базовый маршрут развития цифровых привычек.']}
function render(){if(st.page==='start'){app.innerHTML=`<section class="card start"><div class="intro"><span class="eyebrow">DIGITAL MINDSET · SALES 360°</span><h1>Цифровой портрет менеджера по продажам</h1><p>Диагностика показывает, насколько системно менеджер использует CRM, данные, ИИ и цифровые инструменты.</p><div class="metrics"><div><b>24</b><span>вопроса</span></div><div><b>6</b><span>блоков</span></div><div><b>8–10</b><span>минут</span></div></div></div><div class="form"><span class="eyebrow">ПЕРЕД СТАРТОМ</span><h2>Укажите участника</h2><p>Результат сформируется сразу после завершения.</p><label>ФИО менеджера</label><input id="name" placeholder="Например, Иван Петров"><label>Отдел / кластер</label><input id="team" placeholder="Например, ПФО"><button id="start">Начать диагностику</button></div></section>`;document.querySelector('#start').onclick=()=>{st.name=document.querySelector('#name').value.trim();st.team=document.querySelector('#team').value.trim();if(st.name){st.page='quiz';render()}};return}if(st.page==='result'){let sc=B.map((b,bi)=>Math.round(Q.reduce((x,q,k)=>x+(q.bi===bi?st.a[k]:0),0)/20*100)),tot=Math.round(sc.reduce((a,b)=>a+b)/6),lv=level(tot),wk=sc.map((s,i)=>({s,i})).sort((a,b)=>a.s-b.s).slice(0,2);app.innerHTML=`<section class="card"><header class="top"><div class="brand">DM</div><div><b>Digital Mindset 360°</b><small>${st.name} · ${st.team}</small></div></header><div class="resultHead"><div><span class="eyebrow">ИТОГОВЫЙ ПРОФИЛЬ</span><h1>${lv[0]}</h1><p>${lv[1]}</p></div><div class="score">${tot}<small>/100</small></div></div><div class="result"><div class="panel"><h2>Профиль компетенций</h2>${B.map((b,i)=>`<div class="bar"><div><span>${b[0]}</span><b>${sc[i]}%</b></div><div class="track"><i style="width:${sc[i]}%"></i></div></div>`).join('')}</div><div class="panel"><h2>Фокус развития</h2>${wk.map((w,r)=>`<div class="focus"><b>${r+1}. ${B[w.i][0]} · ${w.s}%</b><p class="muted">Внедрить одну практику и измерить эффект за 30 дней.</p></div>`).join('')}<button onclick="location.reload()">Новая оценка</button></div></div></section>`;return}let q=Q[st.idx];app.innerHTML=`<section class="card"><header class="top"><div class="brand">DM</div><div><b>Digital Mindset 360°</b><small>${st.name} · ${st.team}</small></div><div class="count">${st.idx+1} / 24</div></header><div class="quiz"><aside class="side">${B.map((b,i)=>`<div class="${i===q.bi?'active':''}"><b>${i+1}. ${b[0]}</b><small>${i<q.bi?'Завершено':i===q.bi?'Вопрос '+(q.qi+1)+' из 4':'Впереди'}</small></div>`).join('')}</aside><section class="q"><div><span class="chip">${B[q.bi][0]}</span><h1>${q.t}</h1><p class="muted">Выберите вариант, который описывает обычную практику.</p></div><div class="options">${O.map((o,i)=>`<div class="option ${st.a[st.idx]===i+1?'sel':''}" data-v="${i+1}"><i>${i+1}</i>${o}</div>`).join('')}</div><div class="actions"><button class="back" id="back" ${st.idx?'':'disabled'}>Назад</button><button id="next" ${st.a[st.idx]?'':'disabled'}>${st.idx===23?'Показать результат':'Далее'}</button></div></section></div></section>`;document.querySelectorAll('.option').forEach(x=>x.onclick=()=>{st.a[st.idx]=+x.dataset.v;render()});document.querySelector('#back').onclick=()=>{if(st.idx){st.idx--;render()}};document.querySelector('#next').onclick=()=>{if(st.a[st.idx]){if(st.idx===23)st.page='result';else st.idx++;render()}}}render();
</script></body></html>
