name: Обновление тендеров
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать данные из API
        env:
          EIS_API_URL: ${{ secrets.EIS_API_URL }}
          EIS_API_TOKEN: ${{ secrets.EIS_API_TOKEN }}
          ROSELTORG_API_URL: ${{ secrets.ROSELTORG_API_URL }}
          ROSELTORG_API_TOKEN: ${{ secrets.ROSELTORG_API_TOKEN }}
          B2B_API_URL: ${{ secrets.B2B_API_URL }}
          B2B_API_TOKEN: ${{ secrets.B2B_API_TOKEN }}
          FABRIKANT_API_URL: ${{ secrets.FABRIKANT_API_URL }}
          FABRIKANT_API_TOKEN: ${{ secrets.FABRIKANT_API_TOKEN }}
        run: python tender-finder/scripts/collector.py
      - name: Опубликовать обновление
        run: |
          git config user.name "kit-tender-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tender-finder/data/tenders.json
          git diff --cached --quiet || git commit -m "Обновить список тендеров"
          git push
